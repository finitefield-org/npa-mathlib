module = "Mathlib.Logic.Function.Basic"
change_kind = "add"
source_modules = []
interface_status = "adopted"
proof_evidence = false
summary = "Adds the function-composition associativity identity to the first public NPA function foundation."
scope = "Adopt only the exact comp_assoc theorem closure and its exported composition foundation in the Mathlib.Logic.Function.Basic target; exclude the other upstream Function.Defs constructions and theorem families until separately evidenced."
imports = ["Mathlib.Logic.Eq", "Std.Logic.Eq"]
adoption_date = "2026-08-02"
adoption_rationale = "Re-adopted after owner qualification established both the explicit Std.Logic.Eq import boundary and the owner-exported public comp foundation; the exact function-equality surface remains independently authored and constrained to the selected two-declaration module."
re_adoption_rationale = "Implementation qualification first showed that Mathlib.Logic.Eq does not re-export the Std.Logic.Eq equality declaration, so revision 2 added the required direct equality import. Target qualification then showed that the owner certificate exports every top-level declaration, including comp, so the original support-only surface could not pass the exact target gate. Revision 3 promotes comp to an explicit public foundation with a foundation exception, retains the exact declaration terms and imports, and was re-adopted after both transition checks."
alternatives_review = "Reviewed the upstream Defs target, an Algebra.Function.Basic placement, the compose_assoc name, pointwise equality, complete-file copying, relying on Mathlib.Logic.Eq's transitive import alone, and hiding comp as a private support declaration. The selected Basic module, comp_assoc name, explicit Std.Logic.Eq boundary, and public comp foundation are the only surface representable by the owner certificate while preserving the observed function-equality API. No material bundled, setoid, or quotient alternative applies."
supersedes = []

[[declarations]]
name = "comp"
kind = "definition"
surface = "public"
signature = "forall (alpha : Sort u1), forall (beta : Sort u2), forall (gamma : Sort u3), forall (f : forall (x : beta), gamma), forall (g : forall (x : alpha), beta), forall (x : alpha), gamma"
body = "fun alpha => fun beta => fun gamma => fun f => fun g => fun x => f (g x)"
semantic_role = "Provides the locally authored ordinary function-composition operation as the public foundation needed to express the associativity theorem without assuming an unavailable Function.comp core primitive."
depends_on = []
evidence_ids = []
foundation_exception = "The owner certificate exports every top-level declaration, so this independently authored composition primitive is an explicit public foundation for the public comp_assoc theorem even though direct downstream use targets the theorem."

[[declarations]]
name = "comp_assoc"
kind = "theorem"
surface = "public"
signature = "forall (alpha : Sort u1), forall (beta : Sort u2), forall (phi : Sort u3), forall (delta : Sort u4), forall (f : forall (x : phi), delta), forall (g : forall (x : beta), phi), forall (h : forall (x : alpha), beta), @Eq.{imax u1 u4} (forall (x : alpha), delta) (@comp.{u1,u2,u4} alpha beta delta (@comp.{u2,u3,u4} beta phi delta f g) h) (@comp.{u1,u3,u4} alpha phi delta f (@comp.{u1,u2,u3} alpha beta phi g h))"
semantic_role = "Associates three ordinary function compositions as an equality of functions, matching the pinned downstream rewrite surface."
depends_on = ["comp"]
evidence_ids = ["mathlib-defs-declaration", "mathlib-iterate-rewrite"]
proof_reference_ids = ["mathlib-comp-assoc-proof-structure"]

