schema = "npa.mathlib.interface_proposal.v1"
proposal_id = "Mathlib.Category.Functor"
proposal_revision = 3
previous_proposal_hash = "sha256:2855c846b9e6f4854a983bac790cc3540e926f5f98be7d76dae0243aff78bff8"
module = "Mathlib.Category.Functor"
change_kind = "add"
source_modules = []
interface_status = "adopted"
proof_evidence = false
summary = "Adopts the exact functor-law foundation layered on Mathlib.Category.Basic for the NPA category and arithmetic-geometry corpus."
scope = "Adopt the exact eight-declaration functor-law foundation in Mathlib.Category.Functor, with all eight declarations public and a direct dependency on Mathlib.Category.Basic; exclude natural transformations, concrete functors, and implementation artifacts."
imports = ["Mathlib.Category.Basic", "Mathlib.Logic.EqReasoning", "Std.Logic.Eq"]
adoption_date = "2026-08-04"
adoption_rationale = "The pinned npa-corpus and npa-project-iut sources expose the same eight-declaration explicit functor-law surface, and pinned downstream scans show 16 and 191 direct Functor imports respectively. The exact law-bundle bodies, explicit Category.Basic dependency, public declaration boundary, and reviewed alternatives are sufficiently precise for independent NPA implementation while keeping natural transformations and concrete functors outside this module."
alternatives_review = "Reviewed Mathlib.Category.Functor.Basic and Mathlib.Category.Morphism.Functor as module names, map_id and map_comp as theorem names, bundled functor records as a signature alternative, and folding the hom-functor and identity/composite functor results into Category.Basic. The namespace policy lists Mathlib.Category.Functor, the pinned source preserves the functor-law names, and separate downstream usage supports this boundary. No material alternative remains for this proposed functor-law surface; quotient-backed interfaces are excluded by repository policy."
supersedes = []

