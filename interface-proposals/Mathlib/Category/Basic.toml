schema = "npa.mathlib.interface_proposal.v1"
proposal_id = "Mathlib.Category.Basic"
proposal_revision = 5
previous_proposal_hash = "sha256:d2bcaffa27e5ae8b99bc82b3cc1df8078b4a08fc3d1cf5f194ca48b613ea4713"
module = "Mathlib.Category.Basic"
change_kind = "add"
source_modules = []
interface_status = "adopted"
proof_evidence = false
summary = "Adopts the exact category-law foundation used by the NPA category and arithmetic-geometry corpus."
scope = "Adopt the exact seven-declaration category-law foundation in Mathlib.Category.Basic, with all seven declarations public; exclude functor laws, natural transformations, concrete category constructions, and implementation artifacts."
imports = ["Mathlib.Logic.EqReasoning", "Std.Logic.Eq"]
adoption_date = "2026-08-04"
adoption_rationale = "The exact target surface now follows the canonical certificate declaration order while preserving the seven public declarations, exact signatures and definition body, direct imports, dependency graph, and reviewed module boundary."
re_adoption_rationale = "Revision 4 could not pass the exact-surface gate because its declaration rows followed source-semantic order while canonical certificate reconstruction requires dependency-safe name order. Revision 5 changes only the declaration row order, retains all seven public declarations, signatures, body, dependencies, imports, evidence, proof references, alternatives, and namespace decision, and is re-adopted after the temporary target reports surface parity."
alternatives_review = "Reviewed Mathlib.Category.Defs and Mathlib.Category.Theory.Basic as module names, category_compose_assoc as a theorem name, a bundled category structure as a signature alternative, and folding the directly dependent Functor surface into this module. Basic is the namespace-policy foundation name, the source declaration names preserve the observed semantic surface, and the 20 plus 263 pinned downstream imports establish broad reuse of the category-law foundation while the directly imported Functor module remains a separate boundary. No material alternative remains for this proposed category-law boundary; quotient-backed interfaces are excluded by repository policy."
supersedes = []

[[declarations]]
name = "CategoryLawArgs"
kind = "definition"
surface = "public"
signature = "forall (Obj : Sort u), forall (Hom : forall (A : Obj), forall (B : Obj), Sort v), forall (id : forall (A : Obj), Hom A A), forall (comp : forall (A : Obj), forall (B : Obj), forall (C : Obj), forall (g : Hom B C), forall (f : Hom A B), Hom A C), Prop"
body = "fun Obj => fun Hom => fun id => fun comp => forall (P : Prop), forall (mk : forall (comp_id_law : forall (A : Obj), forall (B : Obj), forall (f : Hom A B), @Eq.{v} (Hom A B) (comp A A B f (id A)) f), forall (id_comp_law : forall (A : Obj), forall (B : Obj), forall (f : Hom A B), @Eq.{v} (Hom A B) (comp A B B (id B) f) f), forall (comp_assoc_law : forall (A : Obj), forall (B : Obj), forall (C : Obj), forall (D : Obj), forall (h : Hom C D), forall (g : Hom B C), forall (f : Hom A B), @Eq.{v} (Hom A D) (comp A B D (comp B C D h g) f) (comp A C D h (comp A B C g f))), P), P"
semantic_role = "Bundles the identity and composition laws used as the reusable category foundation."
depends_on = []
evidence_ids = ["npa-corpus-category-law-args"]

[[declarations]]
name = "category_comp_assoc"
kind = "theorem"
surface = "public"
signature = "forall (Obj : Sort u), forall (Hom : forall (A : Obj), forall (B : Obj), Sort v), forall (id : forall (A : Obj), Hom A A), forall (comp : forall (A : Obj), forall (B : Obj), forall (C : Obj), forall (g : Hom B C), forall (f : Hom A B), Hom A C), forall (category_args : @CategoryLawArgs.{u,v} Obj Hom id comp), forall (A : Obj), forall (B : Obj), forall (C : Obj), forall (D : Obj), forall (h : Hom C D), forall (g : Hom B C), forall (f : Hom A B), @Eq.{v} (Hom A D) (comp A B D (comp B C D h g) f) (comp A C D h (comp A B C g f))"
semantic_role = "Provides the category composition associativity theorem as a direct public rewrite surface."
depends_on = ["CategoryLawArgs"]
evidence_ids = ["npa-corpus-category-comp-assoc"]
proof_reference_ids = ["npa-corpus-category-comp-assoc-proof"]

